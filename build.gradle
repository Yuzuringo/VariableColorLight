buildscript {
    repositories { mavenCentral(); maven { name = 'forge'; url = 'https://maven.minecraftforge.net' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT' }
}
apply plugin: 'forge'

version = '0.1.0'
group = 'jp.example.variablecolorlight'
archivesBaseName = 'VariableColorLight'

sourceCompatibility = targetCompatibility = '1.7'
minecraft { version = '1.7.10-10.13.4.1614-1.7.10'; runDir = 'run' }
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand version: project.version }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar { manifest { attributes 'FMLCorePlugin': 'jp.example.variablecolorlight.core.VCLLoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true' } }

// ForgeGradle 1.2 still points at Mojang's retired S3 endpoints. When the
// official jars have been seeded into its cache, do not let the legacy tasks
// overwrite them with zero-byte files before failing on HTTP 404.
downloadClient.enabled = false
downloadServer.enabled = false
